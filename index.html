<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shahal's Birthday Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #07090e;
  --card-bg: rgba(18, 22, 34, 0.85);
  --border: rgba(255, 255, 255, 0.08);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --pink: #ec4899;
  --gold: #f59e0b;
  --accent-glow: rgba(236, 72, 153, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden; /* Fixes right-side horizontal scroll bug on mobile */
  position: relative;
}

/* Optimized Background Orbs */
.bg-ambient {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
}

.orb {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.15;
  will-change: transform;
  transform: translate3d(0, 0, 0);
}

.orb-1 { background: var(--pink); top: -100px; left: -100px; }
.orb-2 { background: var(--gold); bottom: -100px; right: -100px; }

/* Subtle Matrix Grid */
.grid-overlay {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index: -1;
}

/* Main Layout */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  width: 100%;
}

.card {
  max-width: 680px;
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: clamp(24px, 5vw, 48px);
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
  position: relative;
  z-index: 2;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

/* Header & Status */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(236, 72, 153, 0.1);
  border: 1px solid rgba(236, 72, 153, 0.2);
  border-radius: 50px;
  color: var(--pink);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.sound-toggle {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.sound-toggle:hover {
  background: rgba(255, 255, 255, 0.1);
}

h1 {
  font-size: clamp(2rem, 4vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin-bottom: 14px;
  background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: var(--text-muted);
  font-size: 1rem;
  line-height: 1.6;
  margin-bottom: 32px;
}

/* Countdown Grid */
.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.time-box {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 8px;
  text-align: center;
}

.time-value {
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 700;
  color: var(--text-main);
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}

.time-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

/* Interactive Actions */
.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 14px 24px;
  border-radius: 14px;
  cursor: pointer;
  border: none;
  transition: transform 0.15s ease, background 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex: 1;
  min-width: 140px;
}

.btn:active {
  transform: scale(0.96); /* Instant responsive touch feedback without lag */
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink), #db2777);
  color: #ffffff;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.btn-primary:hover {
  opacity: 0.95;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.09);
}

/* Footer */
.site-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  background: rgba(7, 9, 14, 0.9);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  color: var(--text-muted);
  z-index: 10;
}

.footer-brand {
  color: var(--text-main);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.2s;
}

.footer-brand:hover {
  color: var(--pink);
  text-decoration: underline;
}

/* Mobile Responsive Adjustments */
@media(max-width: 580px) {
  .countdown-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .actions {
    flex-direction: column;
  }
  .btn {
    width: 100%;
  }
  .site-footer {
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }
}
</style>
</head>
<body>

<!-- Optional Background Music: Add any direct mp3 link in the src="" below when you want background music -->
<audio id="bg-music" loop>
  <source src="" type="audio/mpeg">
</audio>

<div class="bg-ambient">
  <div class="grid-overlay"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<main>
  <div class="card">
    <div class="top-header">
      <div class="badge">🎉 Official Countdown</div>
      <button class="sound-toggle" id="sound-btn" onclick="toggleSound()">
        <span>🔊 Sound: Off</span>
      </button>
    </div>

    <h1>Shahal's Birthday Portal</h1>
    <p class="subtitle" id="subtitle-text">Counting down every second until July 3!</p>

    <div class="countdown-grid">
      <div class="time-box">
        <div class="time-value" id="days">00</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="minutes">00</div>
        <div class="time-label">Minutes</div>
      </div>
      <div class="time-box">
        <div class="time-value" id="seconds">00</div>
        <div class="time-label">Seconds</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="triggerCelebration()">✨ Send Celebration</button>
      <button class="btn btn-secondary" onclick="sharePortal()">🔗 Share Portal</button>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>© 2026 <a href="https://shahalglide.com" class="footer-brand" target="_blank" rel="noopener">Shahal Glide</a></div>
  <div style="color: var(--text-muted); font-size: 0.8rem;">All Rights Reserved</div>
</footer>

<script>
// Target Date Logic for July 3 every year
function getNextBirthday() {
  const now = new Date();
  const currentYear = now.getFullYear();
  let bday = new Date(currentYear, 6, 3); // Month 6 is July (0-indexed: Jan=0...Jul=6)

  // If July 3 has already passed this year, target next year
  if (now > bday) {
    bday = new Date(currentYear + 1, 6, 3);
  }
  return bday;
}

function updateCountdown() {
  const now = new Date();
  const target = getNextBirthday();
  const diff = target - now;

  if (diff <= 0) {
    document.getElementById("subtitle-text").textContent = "✨ Happy Birthday Shahal! Today is the big day! 🎉";
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / 1000 / 60) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("days").textContent = String(days).padStart(2, '0');
  document.getElementById("hours").textContent = String(hours).padStart(2, '0');
  document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
  document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
}

setInterval(updateCountdown, 1000);
updateCountdown();

// Audio & Synthesizer Chime
let soundEnabled = false;
const audioEl = document.getElementById("bg-music");

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById("sound-btn");
  if (soundEnabled) {
    btn.innerHTML = "🔊 Sound: On";
    audioEl.play().catch(() => {});
    playChime();
  } else {
    btn.innerHTML = "🔊 Sound: Off";
    audioEl.pause();
  }
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  } catch(e) {}
}

// Celebration & Share actions
function triggerCelebration() {
  playChime();
  const subtitle = document.getElementById("subtitle-text");
  const originalText = subtitle.textContent;
  subtitle.textContent = "🎉 Cheers! Celebration vibe sent successfully! 🎈";
  setTimeout(() => {
    subtitle.textContent = originalText;
  }, 3000);
}

function sharePortal() {
  if (navigator.share) {
    navigator.share({
      title: "Shahal's Birthday Portal",
      url: window.location.href
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert("Birthday portal link copied to clipboard!");
  }
}
</script>

</body>
</html>
